name: Android Existing Tests

# Triggers
on:
  push:
    branches: [main, 'class4/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-existing-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Setup JVM
  jvm:
    name: Existing JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:

      # Checkout action to pull code
      - uses: actions/checkout@v4
      - name: Install test JDK
        id: java21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Installs java 25
      - name: Install daemon JDK
        id: java25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

        # Exposes Gradle toolchains
      - name: Expose both toolchains
        run: |
          mkdir -p "$HOME/.gradle"
          printf '\norg.gradle.java.installations.paths=%s,%s\n' \
            '${{ steps.java21.outputs.path }}' \
            '${{ steps.java25.outputs.path }}' >> "$HOME/.gradle/gradle.properties"

      # Setup the android platform tools
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # INstall the compile sDK
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run existing JVM suite
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest
      # Builds APK
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug


      # Uploads evidence
      - name: Upload JVM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: existing-jvm-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/apk/debug/*.apk